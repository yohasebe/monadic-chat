name: Lint

# Anti-pattern lint suite (see docs_dev/architecture_hardening_plan.md
# for the rationale and the per-rule baselines). Each rule catches one
# class of regression we have already shipped at least once; running
# them on every PR is the lowest-cost way to keep that class extinct.
#
# The rules use only Ruby's stdlib, so we deliberately skip Bundler and
# the docker/services/ruby Gemfile to keep this job under 30s.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  anti-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Personal home-directory paths
        run: ruby scripts/lint/check_personal_paths.rb

      - name: Shell command interpolation escape
        run: ruby scripts/lint/check_shell_escape.rb

      - name: XHR-route × fetch pair check
        run: ruby scripts/lint/check_xhr_pair.rb

      - name: /monadic/data literals outside Environment helper
        run: ruby scripts/lint/check_data_path_literals.rb

      - name: Deprecated model terms in docs/translations
        run: ruby scripts/lint/check_deprecated_models.rb

      - name: EN/JA documentation heading parity
        run: ruby scripts/lint/check_docs_parity.rb

      - name: Duplicate translation keys
        run: ruby scripts/lint/check_duplicate_translation_keys.rb

      - name: App-docs table matches MDSL files
        run: ruby scripts/lint/check_app_docs_sync.rb

      - name: Bare ws.send outside the safeWsSend helper
        run: ruby scripts/lint/check_bare_ws_send.rb

      - name: Model lifecycle consistency
        run: ruby scripts/lint/check_model_consistency.rb

      - name: Documentation links resolve
        run: ruby scripts/lint/check_docs_links.rb

      - name: Lint self-check (rules still detect their target patterns)
        run: ruby scripts/lint/spec/check_self_test.rb

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Warnings are tolerated for now; eslint exits non-zero only on
      # errors (no --max-warnings flag).
      - name: ESLint
        run: npx eslint .
