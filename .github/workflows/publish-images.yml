name: Publish service images

# Builds and publishes the prebuilt service images (embeddings, privacy,
# extractor, python) to ghcr.io as multi-arch manifests
# (linux/amd64 + linux/arm64).
#
# Why prebuilt: embeddings/privacy/extractor are user-independent (no
# install options or language selection baked in — language choices are
# runtime env since the Phase 5-2 refactor), so every user can pull the
# same CI-built digest instead of paying a local torch-sized build and
# depending on Docker Hub base-image pulls at install time (the
# historical CI flake source). The python image is the DEFAULT build
# (every install option false): users without options pull it directly,
# and custom builds use it as a layer-cache source (`--cache-from` +
# the inline cache embedded below), paying only for their enabled
# options. The python Dockerfile keeps all unconditional layers before
# the first conditional one so the default image is a cache prefix of
# every custom build.
#
# Why a native arm64 runner instead of QEMU: torch-class images take hours
# under emulation; `ubuntu-24.04-arm` runners are free for public repos.
# Each arch builds in parallel and pushes by digest; a merge job stitches
# the digests into one manifest per service, so compose pulls the right
# arch automatically on macOS (Apple Silicon), Windows (WSL2) and Linux.
#
# Triggers / tag policy:
#   - push to dev touching a service directory → builds, and tags the
#     result :dev and :dev-<commit sha> (never exposed to end users). The
#     :dev-<sha> tag names the images of one commit, so a release
#     candidate is checked against exactly those images.
#   - workflow_dispatch (`source` = dev-<sha>, `version`) → builds nothing:
#     the checked :dev-<sha> manifests are copied to :<version> and then
#     :latest, and each copy must have the source's digest. User installs
#     consume :latest by default, so it moves only here, at a release.
#   - push to main publishes nothing: a rebuild there would differ from
#     the images the release candidate was checked against.
#   - end users can pin or switch tags via MONADIC_IMAGE_TAG in
#     ~/monadic/config/env (compose interpolation; default latest)
#
# One-time setup: after the first publish, each ghcr.io package must be
# made PUBLIC once (GitHub → Packages → package settings → visibility),
# otherwise anonymous `docker compose pull` fails for users and CI.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'The checked images to publish: dev-<full commit sha>'
        required: true
        type: string
      version:
        description: 'The version tag to publish them as, with :latest (e.g. 1.0.0-beta.44)'
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - '.github/workflows/publish-images.yml'
      - 'docker/services/embeddings/**'
      - 'docker/services/privacy/**'
      - 'docker/services/extractor/**'
      - 'docker/services/python/**'
      - 'docker/services/qdrant/**'
      - 'docker/services/selenium/**'

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [embeddings, privacy, extractor, python, qdrant, selenium]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: build ${{ matrix.service }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/services/${{ matrix.service }}
          platforms: linux/${{ matrix.platform.arch }}
          # Inline cache lets user machines run `docker build --cache-from
          # <this image>` and reuse the published layers (the python custom
          # option builds rely on this).
          cache-to: type=inline
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/monadic-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true

      # The python image ships a model file (Silero VAD) and onnxruntime for
      # speech_segments.py. Run the image on this runner (same arch) and ask
      # it, before the merge job gives the digest a tag: exactly the model and
      # its license in /monadic/models, the model's hash and the onnxruntime
      # version as the Dockerfile pins them, the license as the repository
      # has it, and the speech segment tests passing. A failure here stops
      # the job, so the digest is never tagged.
      - name: Check the speech model in the python image
        if: matrix.service == 'python'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/monadic-python@${{ steps.build.outputs.digest }}
        run: |
          expected=$(sed -n 's/.*"\([0-9a-f]\{64\}\)  \/monadic\/models\/silero_vad.onnx".*/\1/p' docker/services/python/Dockerfile)
          runtime=$(sed -n 's/.*onnxruntime==\([0-9][0-9.]*\).*/\1/p' docker/services/python/Dockerfile)
          # Each value must be exactly one well-formed line; each test stops the step on its own.
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "model hash not found once in the Dockerfile"; exit 1; }
          [[ "$runtime" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "onnxruntime pin not found once in the Dockerfile"; exit 1; }
          docker run --rm -e EXPECTED="$expected" -e RUNTIME="$runtime" \
            -v "$PWD/docker/services/python/licenses/silero-vad-LICENSE:/expected/LICENSE:ro" "$IMAGE" bash -c '
            set -euo pipefail
            [ "$(ls -A /monadic/models | sort | tr "\n" " ")" = "silero_vad.LICENSE silero_vad.onnx " ] || {
              echo "unexpected files in /monadic/models: $(ls -A /monadic/models | tr "\n" " ")"; exit 1; }
            echo "$EXPECTED  /monadic/models/silero_vad.onnx" | sha256sum -c -
            cmp /expected/LICENSE /monadic/models/silero_vad.LICENSE
            python -c "import os, sys, onnxruntime; v = onnxruntime.__version__; print(\"onnxruntime\", v); sys.exit(0 if v == os.environ[\"RUNTIME\"] else \"onnxruntime \" + v + \" is not the pinned \" + os.environ[\"RUNTIME\"])"
            cd /monadic/scripts/converters && python -m unittest test_speech_segments'

      # The privacy image loads its spaCy models when the server starts, and
      # a build can pull in packages that no longer load them. Start it with
      # every language of language_map.json, as users can choose any of them,
      # and ask it: each language loaded, a name and an email masked in
      # English and Japanese, and the server tests passing. A failure here
      # stops the job, so the digest is never tagged.
      - name: Check the privacy image loads and masks
        if: matrix.service == 'privacy'
        timeout-minutes: 15
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/monadic-privacy@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          dir=docker/services/privacy
          langs=$(jq -r 'keys | join(",")' "$dir/language_map.json")
          want=$(jq -c 'keys' "$dir/language_map.json")
          cid=$(docker run -d -p 127.0.0.1:8000:8000 -e PRIVACY_LANGS_RUNTIME="$langs" "$IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          got=""
          for i in $(seq 1 60); do
            if body=$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:8000/v1/health 2>/dev/null); then
              got=$(echo "$body" | jq -c '.languages | sort'); break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true" ] || break
            sleep 3
          done
          [ "$got" = "$want" ] || { echo "languages loaded: ${got:-none}, expected $want"; docker logs "$cid" 2>&1 | tail -30; exit 1; }
          # The name and the email must both be gone from the text, each replaced
          # by the placeholder of its own entity: a placeholder for the email
          # alone, or an empty text, must not pass.
          check() {
            body=$(jq -n --arg t "$2" --arg l "$1" '{text: $t, languages: [$l]}')
            out=$(curl -fsS --connect-timeout 5 --max-time 60 -X POST http://127.0.0.1:8000/v1/anonymize \
              -H 'Content-Type: application/json' -d "$body")
            if echo "$out" | jq -e --arg n "$3" --arg e "$4" '
                . as $r
                | ($r.masked_text | type == "string") and ($r.entities | type == "array")
                and ($r.masked_text | (contains($n) or contains($e)) | not)
                and (["PERSON", "EMAIL_ADDRESS"] | all(. as $t | any($r.entities[];
                  .type == $t and (.placeholder | type == "string" and length > 0)
                  and (.placeholder as $p | $r.masked_text | contains($p)))))' >/dev/null; then
              echo "$1: masked $(echo "$out" | jq -c '[.entities[].type]')"
            else
              echo "$1: the name and the email were not both masked: $out"
              exit 1
            fi
          }
          check en "Please email John Smith at john.smith@example.com tomorrow." "John Smith" "john.smith@example.com"
          check ja "田中太郎さんのメールは taro@example.jp です。" "田中太郎" "taro@example.jp"
          # The server is done with; the test container loads every model again.
          docker rm -f "$cid" >/dev/null
          # The tests run with every language, so the ones for a language are
          # not skipped; their packages are pinned and installed under the
          # image's constraints, so the image's own versions stay as built.
          docker run --rm -e PRIVACY_LANGS_RUNTIME="$langs" -v "$PWD/$dir/tests:/app/tests:ro" --entrypoint bash "$IMAGE" -c '
            set -euo pipefail
            pip install -q --no-cache-dir pytest==8.3.5 httpx==0.27.2 httpcore==1.0.9 iniconfig==2.3.1 pluggy==1.7.0 sniffio==1.3.1
            python -m pip check
            python -m pytest -q -p no:cacheprovider /app/tests'

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Must list the same services as the build matrix above — a service
        # present only there gets its digests pushed but never receives a
        # :latest manifest tag.
        service: [embeddings, privacy, extractor, python, qdrant, selenium]
    name: publish ${{ matrix.service }} manifest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        # Only dev pushes build (see the tag policy at the top): :dev follows
        # the branch, :dev-<sha> stays with this commit for a release to
        # publish unchanged.
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/monadic-${{ matrix.service }}"
          echo "VERIFY_TAG=${IMAGE}:dev-${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker buildx imagetools create -t "${IMAGE}:dev" -t "${IMAGE}:dev-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published manifest
        # ghcr.io can lag a few seconds between accepting a manifest push
        # and serving reads for it (observed on the first publish: create
        # reported DONE, an inspect 0.6s later got "not found"), so retry
        # before declaring the publish broken.
        run: |
          for i in 1 2 3 4 5; do
            if docker buildx imagetools inspect "${VERIFY_TAG}"; then
              exit 0
            fi
            echo "inspect attempt ${i} failed; retrying in 10s..."
            sleep 10
          done
          echo "Manifest for ${VERIFY_TAG} not readable after retries."
          exit 1

  promote:
    # Only the workflow as it is on dev may move :latest, not a copy on
    # another branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    # Two runs for one service would race between the version check and
    # the copy; the second waits for the first.
    concurrency:
      group: promote-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      # One service failing must not leave the others half-published
      # unnoticed; each reports on its own and the run fails.
      fail-fast: false
      matrix:
        service: [embeddings, privacy, extractor, python, qdrant, selenium]
    name: publish ${{ matrix.service }} as ${{ inputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is built: the manifest checked as :<source> is copied as it
      # is. The version tag is written first and must not exist yet, so a
      # published version is never replaced; :latest moves only after the
      # version tag holds the source's digest.
      - name: Copy the checked manifest to the version and latest tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/monadic-${{ matrix.service }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^dev-[0-9a-f]{40}$ ]] || { echo "source must be dev-<full commit sha>"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "version is not a version number"; exit 1; }
          digest_of() {
            local i
            for i in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; a published version is not replaced"
            exit 1
          fi
          src=$(digest_of "${IMAGE}:${SOURCE}")
          echo "source ${IMAGE}:${SOURCE} = ${src}"
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${src}"
          got=$(digest_of "${IMAGE}:${VERSION}")
          [ "$got" = "$src" ] || { echo "${VERSION} has ${got}, not ${src}; :latest is left as it was"; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${src}"
          got=$(digest_of "${IMAGE}:latest")
          [ "$got" = "$src" ] || { echo "latest has ${got}, not ${src}"; exit 1; }
          echo "${IMAGE}:${VERSION} and :latest = ${src}"
