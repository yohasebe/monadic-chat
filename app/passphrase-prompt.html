<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <script src="window-theme.js"></script>
  <title>Passphrase</title>
  <link rel="stylesheet" href="vendor/montserrat/montserrat.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <style>
    /* Laid out like a Web UI modal: the colors come from tokens.css (shared
       with the Web UI); the second value of each var() is the light value,
       used if the shared file could not be loaded. */
    html { font-size: 14px; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", "Original Yu Gothic", "Yu Gothic", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Sans Emoji";
      font-size: 0.95rem;
      margin: 0;
      background: var(--modal-bg, #ffffff);
      color: var(--modal-text, #212529);
    }
    button, input { font-family: inherit; }
    .body { padding: 1rem 1rem 0.5rem; }
    h2 {
      font-size: 1.1em;
      font-weight: 600;
      color: var(--modal-title-color, #777);
      margin: 0 0 0.5rem;
    }
    h2 i { color: var(--color-icon-primary, #ffc107); margin-right: 0.4em; }
    .hint { font-size: 0.9em; color: var(--text-secondary, #777); margin-bottom: 0.75rem; line-height: 1.4; }
    label { display: block; margin-bottom: 0.25rem; }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--modal-input-text, #212529);
      background: var(--modal-input-bg, #ffffff);
      border: 1px solid var(--modal-input-border, #dee2e6);
      border-radius: 0.375rem;
      margin-bottom: 0.5rem;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .err { color: var(--status-error, #dc3545); font-size: 0.85em; min-height: 1.2em; }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--modal-divider-color, #dee2e6);
    }
    button {
      padding: 0.375rem 0.75rem;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 0.375rem;
      border: 1px solid transparent;
      cursor: pointer;
    }
    button:focus { outline: none; }
    #cancel {
      background: var(--btn-secondary-bg, #78828c);
      border-color: var(--btn-secondary-bg, #78828c);
      color: var(--btn-secondary-text, #ffffff);
    }
    #cancel:hover {
      background: var(--btn-secondary-hover-bg, #5a6268);
      border-color: var(--btn-secondary-hover-border, #545b62);
      color: var(--btn-secondary-hover-text, #ffffff);
    }
    #cancel:focus-visible { box-shadow: 0 0 0 0.2rem var(--btn-secondary-focus-shadow-color, rgba(113, 128, 150, 0.25)); }
    #ok {
      background: var(--btn-primary-bg, #007bff);
      border-color: var(--btn-primary-bg, #007bff);
      color: #ffffff;
    }
    /* As in the Web UI, hover wins over active while the pointer is on it. */
    #ok:active:not(:disabled) {
      background: var(--btn-primary-active-bg, #0056b3);
      border-color: var(--btn-primary-active-border, #004085);
    }
    #ok:hover:not(:disabled) {
      background: var(--btn-primary-hover-bg, #0069d9);
      border-color: var(--btn-primary-hover-border, #0062cc);
    }
    #ok:focus-visible { box-shadow: 0 0 0 0.2rem var(--btn-primary-focus-shadow-color, rgba(0, 123, 255, 0.25)); }
    #ok:disabled {
      background: var(--btn-primary-disabled-bg, #6c9bd1);
      border-color: var(--btn-primary-disabled-bg, #6c9bd1);
      opacity: 0.65; /* Bootstrap's disabled button, as in the Web UI */
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="body">
    <h2><i class="fas fa-key" aria-hidden="true"></i><span id="title">Enter Passphrase</span></h2>
    <div class="hint" id="hint">Used to encrypt the export file. Minimum 8 characters.</div>
    <label for="pp" id="label-pp">Passphrase</label>
    <input type="password" id="pp" autofocus>
    <div id="confirm-row">
      <label for="pp2" id="label-pp2">Confirm passphrase</label>
      <input type="password" id="pp2">
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="actions">
    <button id="cancel" type="button">Cancel</button>
    <button id="ok" type="button" disabled>OK</button>
  </div>
  <script src="passphrase-prompt.js"></script>
</body>
</html>
