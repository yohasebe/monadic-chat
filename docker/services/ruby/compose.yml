services:
  ruby_service:
    image: yohasebe/monadic-chat:${MONADIC_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_TAG: "monadic-chat"
        GEMS_FINGERPRINT: ${GEMS_FINGERPRINT:-unknown}
    container_name: monadic-chat-ruby-container
    environment:
      HOST_OS: ${HOST_OS:-}
      PRIVACY_FILTER: ${PRIVACY_FILTER:-true}
      PRIVACY_LANGS: ${PRIVACY_LANGS:-en}
      EXTRACTOR_SERVICE: ${EXTRACTOR_SERVICE:-}
      EXTRACTOR_LANGS: ${EXTRACTOR_LANGS:-}
      EXTRA_LOGGING: ${EXTRA_LOGGING:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The named-volume entries (data:/config:/log:) are inert cruft: the
      # bind mount that follows each one targets the same container path
      # and wins, so no named volume is ever materialized (verified
      # 2026-06-12). Left as-is because removing them touches every
      # service's mounts; do NOT add a top-level volumes: section to
      # "fix" them — that would materialize volumes shadowing the binds.
      - data:/monadic/data
      - ~/monadic/data:/monadic/data
      - config:/monadic/config
      - ~/monadic/config:/monadic/config
      - log:/monadic/log
      - ~/monadic/log:/monadic/log
      # The workspace ledger. Only this container mounts it: code running in
      # the Python container can write the shared folder, not this record.
      - ~/monadic/state:/monadic/state
    # Memory-only mount for values the desktop app reads from 1Password on
    # the host (config/env entries written as op:// references). They are
    # streamed in through `docker exec -i` stdin and never touch the
    # container's layers, its config (`docker inspect`) or its environment.
    # The server runs as root here, hence uid 0 and mode 0700.
    tmpfs:
      - /run/monadic-secrets:mode=0700,uid=0,gid=0,size=64k
    ports:
      # Published to the host loopback only: nothing on the web server checks
      # who connects.
      - "127.0.0.1:4567:4567"
      # MCP (Conduit) capability surface, also loopback only: the MCP server
      # has no auth yet and Conduit spends API keys / (later) runs container
      # commands, so it must not reach the LAN. The container binds 0.0.0.0 (see Server.mcp_bind_host) so this
      # forward arrives. Inert unless MCP_SERVER_ENABLED=true. Port tracks the
      # 3100 default; change MCP_SERVER_PORT and this mapping together.
      - "127.0.0.1:3100:3100"
    stdin_open: true
    tty: true
    command: ["sh", "/usr/local/bin/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monadic-chat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/"]
      interval: 3s
      timeout: 5s
      retries: 8
      start_period: 3s
    # No depends_on. The Ruby service comes up immediately and waits for
    # qdrant + embeddings via application-level retry. Tight depends_on
    # ordering is undesirable here because the embeddings container takes
    # ~30-60 seconds to load multilingual-e5-base on first start, and we
    # want the Ruby web UI reachable before that finishes.
    # Python availability is checked dynamically by WebAutomation.available?
